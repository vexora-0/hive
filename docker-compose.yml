# Local development stack.
#
# Redis is required by the order idempotency middleware. It is NOT used for
# background jobs — the BullMQ workers were removed in Plan 03 because image
# processing runs synchronously with sharp.
services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports: ['4000:4000']
    env_file: packages/backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
