name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Still non-blocking: the backend carries one inherited lint error
      # (middleware/auth.ts, @typescript-eslint/no-namespace). See
      # docs/plans/BASELINE.md. Remove continue-on-error when that reaches zero
      # — it is a one-line fix and the last thing keeping this step advisory.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Typecheck backend
        run: pnpm --filter @hive/backend typecheck

      # Now blocking. Plan 00 took the mobile package from 22 errors to 0, which
      # is the condition the previous comment set for removing this.
      - name: Typecheck mobile
        run: pnpm --filter @hive/mobile typecheck

      - name: Build backend
        run: pnpm build:backend

  docker:
    name: Backend image builds
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
