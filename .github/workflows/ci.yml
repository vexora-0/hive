name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The order tests exercise the idempotency middleware, which is Redis-backed
    # and deliberately fails open. Without Redis it would wave a duplicate
    # request through to a UNIQUE violation on orders.idempotency_key, so the
    # replay test would fail for the wrong reason.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Now blocking. The no-namespace error in middleware/auth.ts was the
      # condition the previous comment set for removing continue-on-error, and
      # it was fixed in 40a69fc. Both packages are at 0 errors; warnings do not
      # fail the step.
      - name: Lint
        run: pnpm lint

      - name: Typecheck backend
        run: pnpm --filter @hive/backend typecheck

      # Now blocking. Plan 00 took the mobile package from 22 errors to 0, which
      # is the condition the previous comment set for removing this.
      - name: Typecheck mobile
        run: pnpm --filter @hive/mobile typecheck

      # Now blocking. The suite needs a real Supabase project — it signs users
      # in to mint JWTs and truncates tables between files — so until
      # TEST_SUPABASE_* existed as repository secrets it could not run at all:
      # tests/setup.ts refused to start and the step exited 1 on every push,
      # with `continue-on-error` painting the job green over it. That is worse
      # than not gating, because the tick implied a guard that was not there.
      #
      # The secrets now point at hive-test, and the suite went green on a real
      # run: 218 passed across 8 files in 373.86s. Same two-step used for lint
      # (294b166) and mobile typecheck (1c9d035) — prove it green, then remove
      # the escape hatch.
      - name: Test backend
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
        run: pnpm --filter @hive/backend test

      - name: Build backend
        run: pnpm build:backend

  docker:
    name: Backend image builds
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
