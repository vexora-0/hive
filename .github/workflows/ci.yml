name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Non-blocking for now: the mobile package inherits type errors from
      # before Phase 2 (see docs/plans/BASELINE.md). Remove continue-on-error
      # once Plan 00 lands and the count reaches zero.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Typecheck backend
        run: pnpm --filter @hive/backend typecheck

      - name: Typecheck mobile
        run: pnpm --filter @hive/mobile typecheck
        continue-on-error: true

      - name: Build backend
        run: pnpm build:backend

  docker:
    name: Backend image builds
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
